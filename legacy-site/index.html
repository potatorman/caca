<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101426">
  <meta name="robots" content="noindex,follow">
  <title>Yeni RendeChat adresi</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px;
      color: #f5f6ff;
      background: radial-gradient(ellipse at 50% 0%, rgba(117, 98, 255, .2), transparent 55%), #101426;
    }
    main {
      width: min(100%, 560px); padding: clamp(28px, 7vw, 52px); text-align: center;
      border: 1px solid rgba(183, 177, 255, .2); border-radius: 26px;
      background: rgba(25, 32, 57, .88); box-shadow: 0 24px 80px rgba(0, 0, 0, .28);
    }
    .mark { font-size: 38px; line-height: 1; margin-bottom: 22px; }
    .eyebrow { color: #b7adff; font-size: 11px; font-weight: 800; letter-spacing: .18em; }
    h1 { margin: 12px 0; font-size: clamp(30px, 7vw, 42px); line-height: 1.1; }
    p { margin: 0 auto 26px; max-width: 390px; color: #bfc6e2; line-height: 1.65; }
    a {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; min-height: 58px; padding: 14px 20px; border-radius: 15px;
      color: #fff; background: linear-gradient(120deg, #7869ed, #554bc4);
      font-size: 17px; font-weight: 800; text-decoration: none;
      box-shadow: 0 10px 28px rgba(95, 82, 220, .28);
    }
    a:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .foot { margin-top: 20px; font-size: 12px; color: #8892b5; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✦</div>
    <div class="eyebrow">RENDECHAT</div>
    <h1>Bu domain eski!</h1>
    <p>RendeChat'i kullanmaya devam etmek için lütfen yeni adresimizi ziyaret edin.</p>
    <a href="https://rendechat.web.app/" rel="noopener">rendechat.web.app <span aria-hidden="true">↗</span></a>
    <div class="foot">Yeni ve güncel RendeChat adresi</div>
  </main>
</body>
</html>
