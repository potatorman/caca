name: Standalone game smoke tests

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  standalone-games:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run standalone engine lifecycle tests
        run: node --test games/standalone-smoke.test.mjs
