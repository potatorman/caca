name: Firebase Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main (including game source)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 2

      - name: Install UNO Worker tooling
        working-directory: cloudflare/uno-worker
        run: npm install --no-audit --no-fund

      - name: Test UNO deck and rules engine
        working-directory: cloudflare/uno-worker
        run: npm test

      - name: Validate Cloudflare Worker deployment
        working-directory: cloudflare/uno-worker
        run: npx wrangler deploy --dry-run

      - name: Deploy Cloudflare game Worker before publishing bot-enabled lobbies
        working-directory: cloudflare/uno-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing GitHub Actions secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          npx wrangler deploy --config wrangler.jsonc

      - name: Configure Firebase service-account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CACA_DFE6C }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Missing GitHub secret: FIREBASE_SERVICE_ACCOUNT_CACA_DFE6C"
            exit 1
          fi

          credentials_file="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$credentials_file"
          node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$credentials_file"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$credentials_file" >> "$GITHUB_ENV"

      - name: Deploy Firestore security rules first
        run: >-
          npx --yes firebase-tools@latest deploy
          --only firestore:rules
          --project caca-dfe6c
          --non-interactive

      - name: Check whether the old-domain page changed
        id: legacy
        shell: bash
        run: |
          if git diff --quiet HEAD^ HEAD -- legacy-site/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy RendeChat Hosting site
        run: >-
          npx --yes firebase-tools@latest deploy
          --only hosting:rendechat
          --project caca-dfe6c
          --non-interactive

      - name: Deploy old-domain notice only when its page changes
        if: steps.legacy.outputs.changed == 'true'
        run: >-
          npx --yes firebase-tools@latest deploy
          --only hosting:main
          --project caca-dfe6c
          --non-interactive

      - name: Remove Firebase credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
