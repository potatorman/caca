name: Firebase Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install UNO Worker tooling
        working-directory: cloudflare/uno-worker
        run: npm install --no-audit --no-fund

      - name: Test UNO deck and rules engine
        working-directory: cloudflare/uno-worker
        run: npm test

      - name: Validate Cloudflare Worker deployment
        working-directory: cloudflare/uno-worker
        run: npx wrangler deploy --dry-run

      - name: Configure Firebase service-account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CACA_DFE6C }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Missing GitHub secret: FIREBASE_SERVICE_ACCOUNT_CACA_DFE6C"
            exit 1
          fi

          credentials_file="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$credentials_file"
          node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$credentials_file"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$credentials_file" >> "$GITHUB_ENV"

      - name: Deploy Firebase Hosting and Firestore rules to production
        run: >-
          npx --yes firebase-tools@latest deploy
          --only hosting,firestore
          --project caca-dfe6c
          --non-interactive

      - name: Remove Firebase credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
